server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file resolves to index.html so Angular's
    # router can handle it client-side (e.g. a hard refresh on /e/demo/wall must not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js is regenerated per-container-start (see docker-entrypoint.d) — never let it be cached.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }
}
